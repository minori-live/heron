min_version = '2026.10.0'

[tools]
apm = "latest"
node = "26"
pnpm = "12.10.1"
rust = { channel = "stable", version = "latest", components = "rustfmt,clippy,llvm-tools" }
"cargo:cargo-llvm-cov" = "0.8"
"cargo:cargo-shear" = "1.13"
cmake = "4.3"

[tools."http:llvm"]
version = "22.1.8"
os = ["windows"]
strip_components = 1

[tools."http:llvm".platforms]
windows-x64 = { url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang%2Bllvm-22.1.8-x86_64-pc-windows-msvc.tar.xz" }

[settings]
lockfile = true

[tasks.install]
description = "Install JavaScript workspace dependencies from the pnpm lockfile"
run = "pnpm install --frozen-lockfile --prefer-offline"
sources = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "apps/*/package.json",
  "docs/package.json",
  "packages/*/package.json",
  "crates/*/package.json",
]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks."js:format"]
hide = true
depends = ["install"]
run = "pnpm format"

[tasks."js:format-check"]
hide = true
depends = ["install"]
run = "pnpm format:check"

[tasks."js:check:configs"]
hide = true
depends = ["install"]
run = "pnpm check:configs"

[tasks."js:design:test"]
hide = true
depends = ["install"]
run = "pnpm design:test"

[tasks."js:design:build"]
hide = true
depends = ["install"]
run = "pnpm design:build"

[tasks."rust:format"]
hide = true
run = "cargo fmt --all"

[tasks."rust:format:check"]
hide = true
run = "cargo fmt --all --check"

[tasks."rust:shear"]
hide = true
run = "cargo shear"

[tasks."rust:clippy"]
hide = true
# Order Cargo work sharing a target directory only when both tasks are scheduled.
wait_for = ["native:bindings:debug", "codegen:wire-types:check"]
run = "node scripts/cargo-host.ts clippy --workspace --all-targets --features heron-dsp-node/bench-internals -- -D warnings"

[tasks."rust:test"]
description = "Run Rust workspace tests without installing JavaScript dependencies"
wait_for = ["native:bindings:debug", "codegen:wire-types:check", "rust:clippy"]
run = "node scripts/cargo-host.ts test --workspace --features heron-dsp-node/bench-internals"

[tasks."rust:bench:check"]
hide = true
wait_for = ["native:bindings:debug", "codegen:wire-types:check", "rust:clippy", "rust:test"]
run = "node scripts/cargo-host.ts bench --workspace --bench mixer_graph --bench render_runtime --bench media_streaming --bench recording --features heron-dsp-node/bench-internals --no-run"

[tasks."native:bindings:debug"]
hide = true
depends = ["install"]
run = "pnpm --filter @heron/dsp-node build:debug"

[tasks."native:bindings:release"]
hide = true
depends = ["install"]
run = "pnpm --filter @heron/dsp-node build"

[tasks."native:staged:debug"]
hide = true
depends = ["native:bindings:debug"]
run = "node scripts/native-build.ts build --profile debug"

[tasks."native:staged:release"]
hide = true
depends = ["native:bindings:release"]
run = "node scripts/native-build.ts build --profile release"

[tasks."native:debug"]
hide = true
depends = ["native:staged:debug", "plugins:prepare"]

[tasks."native:release"]
hide = true
depends = ["native:staged:release", "plugins:prepare"]

[tasks."plugins:prepare"]
description = "Download and verify the locked built-in VST3 suite"
depends = ["install"]
run = "pnpm plugins:prepare"

[tasks.dev]
description = "Build debug native artifacts and start Electron development watchers"
depends = ["native:debug"]
run = "pnpm dev"

[tasks.docs]
description = "Start the user documentation site"
depends = ["install"]
run = "pnpm docs:dev"

[tasks."docs-build"]
description = "Build the user documentation site"
depends = ["install"]
run = "pnpm docs:build"

[tasks."codegen:wire-types:check"]
hide = true
# The Rust protocol owns these declarations; regenerate before checking the diff.
depends = ["codegen:wire-types"]
run = "git diff --exit-code -- apps/desktop/src/main/audio-host/wire/generated packages/contracts/src/generated"

[tasks."check:js-lint"]
hide = true
# Type-aware Oxlint needs the generated napi declarations and wire types.
depends = ["check:prepare", "codegen:wire-types:check"]
run = "pnpm lint"

[tasks."check:packages"]
hide = true
depends = ["check:prepare", "codegen:wire-types:check"]
run = "pnpm check:packages"

[tasks."check:static"]
hide = true
depends = [
  "version:check",
  "js:format-check",
  "rust:format:check",
  "rust:shear",
  "rust:clippy",
  "check:js-lint",
  "js:check:configs",
  "check:packages",
]

[tasks."check:js-tests"]
hide = true
depends = ["check:prepare"]
run = "pnpm test:js"

[tasks."check:rust-tests"]
hide = true
depends = ["version:check", "rust:test"]

[tasks."check:design"]
hide = true
depends = ["js:design:test", "js:design:build"]

[tasks."check:bench"]
hide = true
depends = ["version:check", "rust:bench:check"]

[tasks."check:prepare"]
hide = true
depends = ["version:check", "native:bindings:debug"]

[tasks.check]
description = "Run the full JavaScript, Rust, native, and design validation path"
depends = [
  "check:static",
  "check:js-tests",
  "check:rust-tests",
  "check:design",
  "check:bench",
]

[tasks."check-fast"]
description = "Run the fast Rust edit-loop checks without installing JavaScript dependencies"
run = [
  "cargo fmt --all --check",
  "cargo shear",
  "node scripts/cargo-host.ts clippy --workspace --lib --bins --features heron-dsp-node/bench-internals -- -D warnings",
  "node scripts/cargo-host.ts test --workspace --lib --features heron-dsp-node/bench-internals",
]

[tasks.test]
description = "Run JavaScript, native binding, and Rust tests"
depends = ["test:js", "test:rust"]

[tasks."test:prepare"]
hide = true
depends = ["native:bindings:debug"]

[tasks."test:js"]
hide = true
depends = ["test:prepare"]
run = "pnpm test:js"

[tasks."test:rust"]
hide = true
depends = ["rust:test"]

[tasks.format]
description = "Format JavaScript, TypeScript, Vue, configuration, documentation, and Rust"
depends = ["js:format", "rust:format"]

[tasks."format-check"]
description = "Check JavaScript and Rust formatting without modifying files"
depends = ["js:format-check", "rust:format:check"]

[tasks."lint:prepare"]
hide = true
depends = ["native:bindings:debug"]

[tasks."lint:js"]
hide = true
depends = ["lint:prepare"]
run = "pnpm lint"

[tasks."lint:rust"]
hide = true
depends = ["rust:clippy"]

[tasks.lint]
description = "Run JavaScript lint, design audits, and Rust Clippy"
depends = ["lint:js", "lint:rust"]

[tasks.native]
description = "Build release N-API and probes, and prepare locked plug-in artifacts"
depends = ["native:release"]

[tasks."build:desktop"]
hide = true
depends = ["native:release"]
run = "pnpm build:desktop"

[tasks.build]
description = "Build release native artifacts and all Electron bundles"
depends = ["build:desktop"]

[tasks.pack]
description = "Create an unpacked Electron application from release native artifacts"
depends = ["build"]
run = "pnpm --filter @heron/desktop run pack"

[tasks.bench]
description = "Run Rust performance benchmarks"
run = "node scripts/cargo-host.ts bench --workspace --bench mixer_graph --bench render_runtime --bench media_streaming --bench recording --features heron-dsp-node/bench-internals"

[tasks."bench:quick"]
description = "Run shortened Rust performance benchmarks"
run = "node scripts/cargo-host.ts bench --workspace --bench mixer_graph --bench render_runtime --bench media_streaming --bench recording --features heron-dsp-node/bench-internals -- --quick"

[tasks."bench:save"]
description = "Save the main Rust benchmark baseline"
run = "node scripts/cargo-host.ts bench --workspace --bench mixer_graph --bench render_runtime --bench media_streaming --bench recording --features heron-dsp-node/bench-internals -- --save-baseline main"

[tasks."bench:compare"]
description = "Compare Rust benchmarks with the saved main baseline"
run = "node scripts/cargo-host.ts bench --workspace --bench mixer_graph --bench render_runtime --bench media_streaming --bench recording --features heron-dsp-node/bench-internals -- --baseline main"

[tasks."soak:device-recovery"]
description = "Cycle mock audio device loss, return, keep, and replacement decisions"
run = "cargo run -p heron-audio-host --features test-support --example device_recovery_soak --"

[tasks."version:check"]
description = "Check VERSION against Cargo and JavaScript workspace manifests"
run = "node scripts/version.ts check"

[tasks."version:sync"]
description = "Synchronize VERSION across manifests and rebuild N-API bindings"
depends = ["install"]
depends_post = ["native:bindings:debug"]
run = "node scripts/version.ts sync"

[tasks.coverage]
description = "Collect combined JavaScript and Rust coverage in one test pass"
depends = ["install"]
run = "node scripts/rust-coverage.ts local"

[tasks."ci:check:coverage"]
hide = true
depends = ["install"]
run = "node scripts/rust-coverage.ts ci"

[tasks."ci:check:native-coverage"]
hide = true
depends = ["install"]
run = "node scripts/rust-coverage.ts native"

[tasks."ci:check:static"]
hide = true
depends = ["check:static", "check:bench", "check:design"]

[tasks."ci:install:playwright"]
hide = true
depends = ["install"]
run = "pnpm --filter @heron/desktop exec playwright install --with-deps chromium"

[tasks."ci:report:sccache"]
hide = true
run = "node scripts/ci-sccache-report.ts"

[tasks."ci:package:windows-x64"]
hide = true
depends = ["build"]
run = [
  "pnpm --filter @heron/desktop dist --x64",
  "pnpm --filter @heron/desktop verify:package-security",
]

[tasks."ci:package:windows-x64".env]
CSC_IDENTITY_AUTO_DISCOVERY = "false"
HERON_REQUIRE_DEVELOPER_ID_SIGNATURE = "false"
HERON_REQUIRE_NOTARIZATION = "false"

[tasks."ci:package:linux-x64"]
hide = true
depends = ["build"]
run = [
  "pnpm --filter @heron/desktop dist --x64",
  "pnpm --filter @heron/desktop verify:package-security",
]

[tasks."ci:package:linux-x64".env]
CSC_IDENTITY_AUTO_DISCOVERY = "false"
HERON_REQUIRE_DEVELOPER_ID_SIGNATURE = "false"
HERON_REQUIRE_NOTARIZATION = "false"

[tasks."ci:package:linux-arm64"]
hide = true
depends = ["build"]
run = [
  "pnpm --filter @heron/desktop dist --arm64",
  "pnpm --filter @heron/desktop verify:package-security",
]

[tasks."ci:package:linux-arm64".env]
CSC_IDENTITY_AUTO_DISCOVERY = "false"
HERON_REQUIRE_DEVELOPER_ID_SIGNATURE = "false"
HERON_REQUIRE_NOTARIZATION = "false"

[tasks."ci:build:macos-universal"]
hide = true
depends = ["install"]
run = [
  "rustup target add aarch64-apple-darwin x86_64-apple-darwin",
  "pnpm --filter @heron/dsp-node exec napi build --platform --release --target aarch64-apple-darwin",
  "pnpm --filter @heron/dsp-node exec napi build --platform --release --target x86_64-apple-darwin",
  "pnpm --filter @heron/dsp-node exec napi universalize",
  "node scripts/native-build.ts universal-macos --profile release",
  "pnpm plugins:prepare --platform macos-universal",
  "mise run ci:verify:macos-universal",
  "pnpm build:desktop",
]

[tasks."ci:build:macos-universal".env]
MACOSX_DEPLOYMENT_TARGET = "14.2"
# Cargo's macOS default keeps debug info in intermediate objects. Archive dSYMs
# for both addon architectures before those objects disappear from the CI host.
CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO = "packed"

[tasks."ci:package:macos-universal"]
hide = true
depends = ["ci:build:macos-universal"]
run = [
  "pnpm --filter @heron/desktop dist --config electron-builder.universal.yml --universal",
  "pnpm --filter @heron/desktop verify:package-security",
]

[tasks."ci:package:macos-universal".env]
MACOSX_DEPLOYMENT_TARGET = "14.2"
CSC_IDENTITY_AUTO_DISCOVERY = "false"
HERON_REQUIRE_DEVELOPER_ID_SIGNATURE = "false"
HERON_REQUIRE_NOTARIZATION = "false"

[tasks."ci:package:macos-universal-release"]
hide = true
depends = ["ci:build:macos-universal"]
run = [
  "pnpm --filter @heron/desktop dist --config electron-builder.release.yml --universal",
  "pnpm --filter @heron/desktop verify:package-security",
]

[tasks."ci:package:macos-universal-release".env]
MACOSX_DEPLOYMENT_TARGET = "14.2"
HERON_REQUIRE_DEVELOPER_ID_SIGNATURE = "true"
HERON_REQUIRE_NOTARIZATION = "true"
