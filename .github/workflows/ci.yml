name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful CI jobs
        shell: bash
        env:
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" || "$BUILD_RESULT" != "success" ]]; then
            echo "::error::Required CI jobs did not succeed (Test: $TEST_RESULT, Build: $BUILD_RESULT)."
            exit 1
          fi

  deploy-docs:
    name: Deploy documentation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [gate]
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: ${{ github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
