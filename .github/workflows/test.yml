name: Test

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # CI-only compilation tuning. Local dev builds keep full debug info and the
  # optimized dev profile from Cargo.toml; CI only needs line tables for
  # useful backtraces, and MSVC PDB generation is a large part of Windows
  # build time. Incremental compilation is disabled so sccache can cache
  # every rustc invocation (sccache skips incremental compiles).
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the full repository checks with JavaScript and Rust coverage.
        # Windows and macOS collect Rust coverage from Cargo and instrumented napi-rs
        # calls while still running the desktop and project-database tests normally.
        # Oxfmt, Oxlint, Vue ESLint, design audits, TypeScript-only checks, and
        # Storybook produce identical results on every platform and would otherwise
        # dominate the slower runners.
        include:
          - name: Linux x64
            os: ubuntu-24.04
            check-task: ci:check:coverage
            codecov-rust-flag: rust-linux
          - name: Windows x64
            os: windows-latest
            check-task: ci:check:native-coverage
            codecov-rust-flag: rust-windows
          - name: macOS
            os: macos-latest
            check-task: ci:check:native-coverage
            codecov-rust-flag: rust-macos
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up build environment
        id: setup_build
        uses: ./.github/actions/setup-build
        with:
          github-token: >-
            ${{ github.event_name != 'pull_request' && github.token || '' }}
          cache-rust-build: "true"

      - name: Install Playwright Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: |
          mise run ci:install:playwright
          # Steinberg's VSTGUI CMake integration enables its standalone library
          # even when only plug-in example targets are requested.
          sudo apt-get install --yes --no-install-recommends dbus-x11 libgtkmm-3.0-dev ninja-build xauth xvfb

      # A miss runs the network fetch and CMake builds; a hit restores only the
      # finished bundles. The bundles stay small because intermediate build
      # trees are not cached, and `test:official-plugin-fixtures` still probes
      # them at runtime so a stale or broken cache is caught on main.
      - name: Restore official plug-in fixture cache
        id: official-fixtures
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: target/official-plug-in-fixtures
          key: official-plug-in-fixtures-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'mise.toml', 'mise.lock', '.github/workflows/test.yml', '.github/actions/setup-build/action.yml') }}
          restore-keys: |
            official-plug-in-fixtures-${{ runner.os }}-${{ runner.arch }}-

      - name: Fetch pinned official CLAP examples
        if: runner.os == 'Linux' && steps.official-fixtures.outputs.cache-hit != 'true'
        shell: bash
        env:
          CLAP_PLUGINS_COMMIT: 81791d08bb4e5198213440fe43b8e99745210130
        run: |
          fixture_source="$RUNNER_TEMP/clap-plugins"
          git init "$fixture_source"
          git -C "$fixture_source" remote add origin https://github.com/free-audio/clap-plugins.git
          git -C "$fixture_source" fetch --depth 1 origin "$CLAP_PLUGINS_COMMIT"
          git -C "$fixture_source" checkout --detach FETCH_HEAD
          git -C "$fixture_source" submodule update \
            --init \
            --depth 1 \
            clap \
            clap-helpers \
            yas

          actual_commit="$(git -C "$fixture_source" rev-parse HEAD)"
          if [[ "$actual_commit" != "$CLAP_PLUGINS_COMMIT" ]]; then
            echo "::error::Expected CLAP examples commit $CLAP_PLUGINS_COMMIT, got $actual_commit"
            exit 1
          fi
          echo "CLAP_FIXTURE_SOURCE=$fixture_source" >> "$GITHUB_ENV"

      - name: Build official VST3 and CLAP examples
        if: runner.os == 'Linux' && steps.official-fixtures.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake \
            -S . \
            -B target/vst3-fixtures \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHERON_BUILD_VST3_FIXTURES=ON \
            -DSMTG_RUN_VST_VALIDATOR=ON
          cmake --build target/vst3-fixtures --target again note-expression-synth

          cmake \
            -S "$CLAP_FIXTURE_SOURCE" \
            -B target/clap-fixtures \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLAP_PLUGINS_HEADLESS=ON
          cmake --build target/clap-fixtures --target clap-plugins

          again_path="$(find target/vst3-fixtures -type d -name 'again.vst3' -print -quit)"
          synth_path="$(find target/vst3-fixtures -type d -name 'note-expression-synth.vst3' -print -quit)"
          clap_path="$(find target/clap-fixtures -type f -name 'clap-plugins.clap' -print -quit)"
          for fixture in "$again_path" "$synth_path" "$clap_path"; do
            if [[ -z "$fixture" || ! -e "$fixture" ]]; then
              echo "::error::An official plug-in fixture was not produced"
              exit 1
            fi
          done

          # Cache only the finished bundles so the restored archive stays small.
          rm -rf target/official-plug-in-fixtures
          mkdir -p target/official-plug-in-fixtures
          cp -a "$again_path" "$synth_path" target/official-plug-in-fixtures/
          cp -a "$clap_path" target/official-plug-in-fixtures/

      - name: Expose official plug-in fixture paths
        if: runner.os == 'Linux'
        shell: bash
        run: |
          fixtures="target/official-plug-in-fixtures"
          again_path="$fixtures/again.vst3"
          synth_path="$fixtures/note-expression-synth.vst3"
          clap_path="$fixtures/clap-plugins.clap"
          for fixture in "$again_path" "$synth_path" "$clap_path"; do
            if [[ ! -e "$fixture" ]]; then
              echo "::error::Official plug-in fixture is missing: $fixture"
              exit 1
            fi
          done
          echo "VST3_AGAIN_FIXTURE=$again_path" >> "$GITHUB_ENV"
          echo "VST3_SYNTH_FIXTURE=$synth_path" >> "$GITHUB_ENV"
          echo "CLAP_PLUGIN_FIXTURE=$clap_path" >> "$GITHUB_ENV"

      - name: Run repository checks
        run: mise run ${{ matrix.check-task }}

      # Save only after the fixture probes inside the checks above have exercised
      # the relocated bundles, so a broken cache is never published from main.
      - name: Save official plug-in fixture cache
        if: >-
          success() &&
          runner.os == 'Linux' &&
          steps.official-fixtures.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/cache/save@v6
        with:
          path: target/official-plug-in-fixtures
          key: ${{ steps.official-fixtures.outputs.cache-primary-key }}

      - name: Run Electron end-to-end tests
        if: runner.os == 'Linux'
        run: mise run test:e2e

      - name: Verify consent-gated Electron crash delivery
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @heron/desktop test:crash-reporting

      - name: Verify Sentry symbol artifacts
        run: pnpm --filter @heron/desktop test:sentry-symbols

      # Linux produces JavaScript LCOV in addition to the per-platform Rust report.
      # The Rust coverage orchestrators merge profiles from Cargo tests and
      # instrumented napi calls, keeping output in target-coverage/ so it stays out
      # of the shared Cargo target cache. Linux additionally exercises probes and
      # the official plug-in fixtures.
      - name: Upload JavaScript coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Keep this comma-separated list free of spaces: codecov-action
          # forwards each segment verbatim as a --file argument.
          files: apps/desktop/coverage/lcov.info,packages/contracts/coverage/lcov.info,packages/project-db/coverage/lcov.info,packages/project-model/coverage/lcov.info,packages/ui/coverage/lcov.info
          flags: javascript
          name: javascript
          fail_ci_if_error: true
          disable_search: true

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust/lcov.info
          flags: ${{ matrix.codecov-rust-flag }}
          name: ${{ matrix.codecov-rust-flag }}
          fail_ci_if_error: true
          disable_search: true

      - name: Report shared compiler cache health
        if: ${{ always() && steps.setup_build.outcome == 'success' }}
        run: mise run ci:report:sccache

  codecov-finalize:
    name: Finalize Codecov coverage
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Publish merged Codecov statuses and comment
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true
