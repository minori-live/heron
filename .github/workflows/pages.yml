name: Deploy Pages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Tested documentation revision to deploy.
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy documentation and update manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out documentation
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Install locked toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13
          cache: true

      - name: Install workspace dependencies
        run: mise run install

      - name: Build documentation
        run: mise run docs-build

      - name: Include published update manifests
        shell: bash
        run: |
          if git ls-remote --exit-code origin refs/heads/update-manifests >/dev/null; then
            git fetch origin refs/heads/update-manifests:refs/remotes/origin/update-manifests
            if git cat-file -e origin/update-manifests:current 2>/dev/null; then
              mkdir -p "$RUNNER_TEMP/heron-updates" docs/.vitepress/dist/updates
              git archive origin/update-manifests current | tar -x -C "$RUNNER_TEMP/heron-updates"
              cp "$RUNNER_TEMP/heron-updates/current/"* docs/.vitepress/dist/updates/
            fi
          else
            result=$?
            if [[ "$result" -ne 2 ]]; then exit "$result"; fi
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
