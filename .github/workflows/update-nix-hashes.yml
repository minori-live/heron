# Recomputes Nix fixed-output hashes after Renovate changes a lockfile.
# The follow-up commit touches only nix/sources.nix, so this push trigger does
# not run again. NIX_HASH_UPDATE_TOKEN must be a fine-grained PAT (Contents
# read and write on this repository). GITHUB_TOKEN pushes do not start CI.
# See agents/docs/nix-distribution.md.

name: Update Nix hashes

on:
  push:
    branches:
      - "renovate/**"
    paths:
      - "pnpm-lock.yaml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: nix-fod-hashes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Update fixed-output hashes
    if: >-
      github.repository == 'minori-live/heron' &&
      startsWith(github.ref, 'refs/heads/renovate/') &&
      !contains(github.event.head_commit.message, 'chore(nix): update fixed-output hashes')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Plan hash updates
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          changed=()
          while IFS= read -r path; do
            if [[ -n "$path" ]]; then
              changed+=("$path")
            fi
          done < <(git diff --name-only origin/main HEAD -- pnpm-lock.yaml Cargo.lock || true)
          node scripts/nix-fod-hash.ts plan --sources nix/sources.nix -- "${changed[@]}" \
            | tee "${RUNNER_TEMP}/fod-plan"
          if [[ -s "${RUNNER_TEMP}/fod-plan" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.plan.outputs.needed == 'true'
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Magically cache Nix store paths
        if: steps.plan.outputs.needed == 'true'
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Rebuild fixed-output derivations
        if: steps.plan.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r key derivation attribute; do
            if [[ -z "$key" ]]; then
              continue
            fi
            log="${RUNNER_TEMP}/fod-${key}.log"
            set +e
            nix build "$attribute" --print-build-logs --no-link >"$log" 2>&1
            build_status=$?
            set -e
            cat "$log"
            if [[ "$build_status" -eq 0 ]]; then
              echo "${key} fixed-output hash already matches"
              continue
            fi
            set +e
            node scripts/nix-fod-hash.ts apply \
              --sources nix/sources.nix \
              --key "$key" \
              --derivation "$derivation" \
              --log "$log"
            apply_status=$?
            set -e
            if [[ "$apply_status" -eq 2 ]]; then
              echo "::error::${attribute} failed without a fixed-output hash mismatch for the ${key} pin"
              exit 1
            fi
            if [[ "$apply_status" -ne 0 ]]; then
              exit "$apply_status"
            fi
          done < "${RUNNER_TEMP}/fod-plan"
          nix fmt -- nix/sources.nix

      - name: Push updated hashes
        if: steps.plan.outputs.needed == 'true'
        shell: bash
        env:
          NIX_HASH_UPDATE_TOKEN: ${{ secrets.NIX_HASH_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/renovate/*) ;;
            *)
              echo "::error::refusing to push hashes from ${GITHUB_REF}"
              exit 1
              ;;
          esac
          if git diff --quiet -- nix/sources.nix; then
            echo "Fixed-output hashes already match."
            exit 0
          fi
          git --no-pager diff -- nix/sources.nix
          if [[ -z "${NIX_HASH_UPDATE_TOKEN}" ]]; then
            echo "::error::NIX_HASH_UPDATE_TOKEN is not configured, so the corrected hash cannot be pushed. A GITHUB_TOKEN push would not start CI. See agents/docs/nix-distribution.md."
            exit 1
          fi
          git add -- nix/sources.nix
          staged=$(git diff --cached --name-only)
          if [[ "$staged" != "nix/sources.nix" ]]; then
            echo "::error::refusing to commit unexpected files: ${staged}"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          subject=$(node scripts/nix-fod-hash.ts subject)
          git commit -m "$subject" -m "Record the fixed-output hash Nix reported after the Renovate lockfile update."
          branch="${GITHUB_REF#refs/heads/}"
          git fetch --no-tags origin "$branch"
          if [[ "$(git rev-parse HEAD~1)" != "$(git rev-parse "origin/${branch}")" ]]; then
            echo "::error::${branch} moved while the fixed-output hash was building. Not pushing a stale pin."
            exit 1
          fi
          askpass="${RUNNER_TEMP}/nix-hash-askpass.sh"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "x-access-token" ;;' \
            '  *) printf "%s\n" "$NIX_HASH_UPDATE_TOKEN" ;;' \
            'esac' \
            > "$askpass"
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -c credential.helper= \
            push "https://x-access-token@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"
