name: Update Nix flake

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: Sync Nix release pin
    if: >-
      ${{ github.repository == 'minori-live/heron' &&
          (github.event_name == 'workflow_dispatch' ||
           (!github.event.release.draft && !github.event.release.prerelease &&
            startsWith(github.event.release.tag_name, 'v'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require synchronization credentials
        env:
          NIX_SYNC_TOKEN: ${{ secrets.NIX_SYNC_TOKEN }}
        run: |
          if [[ -z "$NIX_SYNC_TOKEN" ]]; then
            echo "::error::Configure NIX_SYNC_TOKEN using agents/docs/nix-distribution.md."
            exit 1
          fi

      - name: Install locked toolchain
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.8
          cache: true

      - name: Synchronize latest stable release
        id: release
        run: mise run nix:sync

      - name: Create or update release PR
        id: pull_request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.NIX_SYNC_TOKEN }}
          base: main
          branch: chore/update-nix-release
          delete-branch: true
          add-paths: nix/release.nix
          commit-message: "chore(nix): update Heron to ${{ steps.release.outputs.version }}"
          title: "chore(nix): update Heron to ${{ steps.release.outputs.version }}"
          body: |
            Track the latest published stable Heron Linux AppImages in the Nix flake.

            Digests come from GitHub's release asset API (same source as the Homebrew Cask).
            Drafts and prereleases do not advance the pin.
