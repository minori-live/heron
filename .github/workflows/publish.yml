name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate tag and version
        id: release
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION is not a valid release version: $version"
            exit 1
          fi

          if [[ "$TAG_NAME" != "v$version" ]]; then
            echo "::error::Tag $TAG_NAME does not match VERSION ($version)"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: validate
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      # Ship installers with Cargo.toml thin-LTO release settings.
      full_release_profile: true
      release_updates: true
      sign_macos: true
    permissions:
      contents: read
    secrets:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  release:
    name: Create draft GitHub release
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: update-manifests
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install locked toolchain
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13
          cache: true

      - name: Install workspace dependencies
        run: mise run install

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: heron-*
          path: release-assets
          merge-multiple: true

      - name: Prepare update manifests for GitHub Pages
        shell: bash
        env:
          HERON_RELEASE_BUILD: "true"
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          node apps/desktop/scripts/prepare-update-manifests.ts \
            release-assets \
            "$RUNNER_TEMP/update-manifests" \
            "$RELEASE_VERSION"

      - name: Stage update manifests until the release is published
        shell: bash
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git ls-remote --exit-code origin refs/heads/update-manifests >/dev/null; then
            git fetch origin refs/heads/update-manifests:refs/remotes/origin/update-manifests
            git switch -C update-manifests origin/update-manifests
          else
            result=$?
            if [[ "$result" -ne 2 ]]; then exit "$result"; fi
            git switch --orphan update-manifests
            git rm -rf .
          fi
          mkdir -p "versions/$TAG_NAME"
          cp "$RUNNER_TEMP/update-manifests/"*.yml "versions/$TAG_NAME/"
          git add "versions/$TAG_NAME"
          if ! git diff --cached --quiet; then
            git commit -m "Stage update manifests for $TAG_NAME"
            git push origin HEAD:update-manifests
          fi

      - name: Keep only installable release assets
        shell: bash
        run: |
          find release-assets -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.blockmap' \) -delete

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS

      - name: Attest release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Create or update draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.validate.outputs.tag }}
        run: |
          release_args=(
            --verify-tag
            --generate-notes
            --title "Heron $TAG_NAME"
            --draft
          )

          if [[ "$TAG_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          if existing_is_draft="$(
            gh release view "$TAG_NAME" --json isDraft --jq .isDraft 2>/dev/null
          )"; then
            if [[ "$existing_is_draft" != "true" ]]; then
              echo "::error::Release $TAG_NAME is already published; refusing to overwrite it."
              exit 1
            fi

            forbidden_assets="$(
              gh release view "$TAG_NAME" --json assets \
                --jq '.assets[] | select(.name | test("[.](yml|yaml|blockmap)$")) | .name'
            )"
            while IFS= read -r asset; do
              if [[ -n "$asset" ]]; then
                gh release delete-asset "$TAG_NAME" "$asset" --yes
              fi
            done <<< "$forbidden_assets"

            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create \
              "$TAG_NAME" \
              release-assets/* \
              "${release_args[@]}"
          fi
