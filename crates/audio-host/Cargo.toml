[package]
name = "heron-audio-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autobins = false
build = false

[dependencies]
ara2-bridge-core.workspace = true
ara2-bridge-host.workspace = true
ara2-bridge-sys.workspace = true
bwavfile.workspace = true
clap-sys.workspace = true
sha2.workspace = true
rustfft.workspace = true
tokio.workspace = true
heron-dsp-runtime.workspace = true
heron-audio-plugin.workspace = true
heron-clap-host.workspace = true
heron-audio-engine.workspace = true
heron-vst3-host.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
heron-audio-engine = { workspace = true, features = ["test-support"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true

[features]
default = []
bench-internals = ["heron-audio-engine/bench-internals"]
test-support = ["heron-audio-engine/test-support"]
