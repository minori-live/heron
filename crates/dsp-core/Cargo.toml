[package]
name = "heron-dsp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Keep the scalar Fallback backend available so tests can exercise Level::fallback()
# dispatch parity beside the host's best SIMD level.
fearless_simd = { workspace = true, features = ["force_support_fallback"] }
fearless_simd_macros.workspace = true

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "mixer_graph"
harness = false
