  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/noto-sans-sc": ^5.3.0
  "@fontsource/barlow-condensed": ^5.3.0
  "@napi-rs/cli": ^3.9.0
  "@playwright/test": 1.65.0
  "@storybook/addon-a11y": 10.6.7
  "@storybook/addon-docs": 10.6.7
  "@storybook/addon-themes": 10.6.7
  "@storybook/addon-vitest": 10.6.7
  "@storybook/vue3": 10.6.7
  "@storybook/vue3-vite": 10.6.7
  "@types/node": ^26.5.1
  "@typescript/native": npm:typescript@7.0.2
  "@unhead/vue": ^3.4.0
  "@vitejs/plugin-vue": 6.0.10
  "@vitest/browser-playwright": 5.1.0
  "@vitest/coverage-v8": 5.1.0
