  "@fontsource-variable/cascadia-mono": ^5.3.0
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/noto-sans-sc": ^5.3.0
  "@fontsource/barlow-condensed": ^5.3.0
  "@napi-rs/cli": ^3.9.0
  "@playwright/test": 1.64.1
  "@storybook/addon-a11y": 10.6.2
  "@storybook/addon-docs": 10.6.2
  "@storybook/addon-themes": 10.6.2
  "@storybook/addon-vitest": 10.6.2
  "@storybook/vue3": 10.6.2
  "@storybook/vue3-vite": 10.6.2
  "@types/node": ^26.5.1
  "@typescript/native": npm:typescript@7.0.2
  "@unhead/vue": ^3.4.0
  "@vitejs/plugin-vue": 6.0.10
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@vue/test-utils": 2.5.1
  "@vue/compiler-dom": 3.6.0-rc.12
  "@vue/compiler-sfc": 3.6.0-rc.12
  happy-dom: 21.0.3
  pinia: 4.1.0
  playwright: 1.64.1
  storybook: 10.6.2
  typescript: npm:@typescript/typescript6@6.0.2
  unocss: 66.11.0
  unplugin-fonts: ^2.0.0
  vite: 8.3.4
  vitest: 5.0.5
  vue: 3.6.0-rc.12
  vue-tsc: 3.3.13
catalogs:
  # Storybook 10's test addon supports Vitest 4; application tests use Vitest 5.
  storybook:
    "@vitest/browser-playwright": 4.1.12
    vitest: 4.1.12
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.28.2
  "ajv@8.20.0>fast-uri": 4.2.2
  "config-chain>ini": 7.0.0
  # minimatch 3 calls the CommonJS function export removed in brace-expansion 3+.
  "minimatch@3.1.5>brace-expansion": 1.1.21
allowBuilds:
  "@sentry/cli": false
  electron: true
  electron-winstaller: false
  esbuild: true
  vue-demi: true
