  storybook: 10.6.7
  typescript: npm:@typescript/typescript6@6.0.2
  unocss: 66.12.0
  unplugin-fonts: ^2.0.0
  vite: 8.3.8
  vitest: 5.1.0
  vue: 3.6.0-rc.14
  vue-tsc: 3.3.14
catalogs:
  # Storybook 10's test addon supports Vitest 4; application tests use Vitest 5.
  storybook:
    "@vitest/browser-playwright": 4.1.12
    vitest: 4.1.12
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.28.2
  "ajv@8.20.0>fast-uri": 4.2.3
  "config-chain>ini": 7.0.0
  # minimatch 3 calls the CommonJS function export removed in brace-expansion 3+.
  "minimatch@3.1.5>brace-expansion": 1.1.22
allowBuilds:
  "@sentry/cli": false
  electron: true
  electron-winstaller: false
  esbuild: true
  vue-demi: true
