<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" role="img" aria-label="Abstract neural network">
  <defs>
    <linearGradient id="revox-net-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171a1f"/>
      <stop offset="45%" stop-color="#1c2030"/>
      <stop offset="100%" stop-color="#171a1f"/>
    </linearGradient>
    <linearGradient id="revox-net-glow" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#a98ade" stop-opacity="0"/>
      <stop offset="35%" stop-color="#a98ade" stop-opacity=".22"/>
      <stop offset="65%" stop-color="#72c3c7" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#e5d899" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="revox-net-node-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cbb6ef"/>
      <stop offset="100%" stop-color="#a98ade"/>
    </radialGradient>
    <radialGradient id="revox-net-node-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9bdadd"/>
      <stop offset="100%" stop-color="#72c3c7"/>
